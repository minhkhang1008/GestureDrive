[platformio]
default_envs = esp1_transmitter, esp2_receiver
src_dir = firmware

[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.7.1
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp1_transmitter]
build_src_filter =
  -<*>
  +<transmitter/transmitter.cpp>

[env:esp2_receiver]
build_src_filter =
  -<*>
  +<receiver/receiver.cpp>
