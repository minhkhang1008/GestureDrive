[platformio]
default_envs = esp1_transmitter, esp2_receiver
src_dir = firmware

; Shared ESP32-S3 settings. Kept out of [env] on purpose: [env] applies to
; every environment, and the host-side `native` test env must not inherit a
; board, the Arduino framework or RadioLib.
[esp32_base]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.7.1
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp1_transmitter]
extends = esp32_base
build_src_filter =
  -<*>
  +<transmitter/transmitter.cpp>

[env:esp2_receiver]
extends = esp32_base
build_src_filter =
  -<*>
  +<receiver/receiver.cpp>

; Host-side unit tests for the Arduino-free headers (protocol framing, CRC,
; sequence arithmetic and the drive math that decides motor current).
; Not in default_envs, so `pio run` still builds only the two firmware images.
; Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter =
  -<*>
build_flags =
  -std=gnu++17
  -I firmware
